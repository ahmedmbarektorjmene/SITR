[workspace]
resolver = "2"
default-members = ["porda"]
members = [
    "crates/core",
    "crates/config",
    "crates/capture",
    "crates/inference",
    "crates/vision",
    "crates/overlay",
    "crates/platform",
    "crates/ui",
    "crates/systray",
    "porda",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["Porda AI"]

[workspace.dependencies]
porda-core = { path = "crates/core" }
config = { path = "crates/config" }
capture = { path = "crates/capture" }
inference = { path = "crates/inference" }
vision = { path = "crates/vision" }
overlay = { path = "crates/overlay" }
platform = { path = "crates/platform" }
ui = { path = "crates/ui" }
systray = { path = "crates/systray" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
